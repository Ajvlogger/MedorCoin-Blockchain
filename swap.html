<div class="swap-box">
  <h1 class="swap-title">Buy MedorCoin</h1>
  
  <div class="input-group">
    <label>Amount of Wrapped Bitcoin (WBTC) to Spend</label>
    <input type="number" id="wbtcInput" step="0.00000001" placeholder="0.00000000" oninput="calculateOutput()">
  </div>

  <div class="input-group">
    <label>Amount of MEDOR You Receive</label>
    <input type="text" id="medorOutput" readonly placeholder="0.0000">
  </div>

  <div class="rate-info">
    <span>Contract Pool Pricing:</span>
    <span id="rateDisplay" style="font-family: monospace;">Loading on-chain rate...</span>
  </div>

  <button class="btn" id="actionButton" onclick="handleTradePipeline()">Connect Wallet</button>
  <div id="feedbackText" class="feedback">Connect your Web3 extension wallet to unlock the transaction pool.</div>
</div>

<script>
  // FIX 1: Corrected your Medor Token contract to your deployed address
  // FIX 2: Added the missing "6" at the end of the official WBTC address string
  const MEDOR_ADDRESS = "0xd37A0F3F4E0E9F79b5eE2EC953EAD81112424b94";
  const WBTC_ADDRESS  = "0x2260FAC5E5542a773Aa44BCfeDf7C193bc2C5996";

  const MEDOR_ABI = [
    "function isSwapActive() view returns (bool)",
    "function tokensPerWBTC() view returns (uint256)",
    "function swapWBTCForMedor(uint256 wbtcAmount) external"
  ];

  const WBTC_ABI = [
    "function allowance(address owner, address spender) view returns (uint256)",
    "function approve(address spender, uint256 value) external returns (bool)"
  ];

  let provider, signer, medorContract, wbtcContract;
  let walletConnected = false;
  let userAddress = "";
  let systemTokensPerWbtc = 0n;

  async function connectWallet() {
    if (!window.ethereum) {
      alert("No Web3 provider recognized. Please install MetaMask or Rabby.");
      return;
    }
    try {
      provider = new ethers.BrowserProvider(window.ethereum);
      const accounts = await provider.send("eth_requestAccounts", []);
      signer = await provider.getSigner();
      userAddress = accounts[0];
      medorContract = new ethers.Contract(MEDOR_ADDRESS, MEDOR_ABI, signer);
      wbtcContract  = new ethers.Contract(WBTC_ADDRESS, WBTC_ABI, signer);
      walletConnected = true;
      await syncContractParameters();
    } catch (err) {
      console.error("Connection cancelled:", err);
    }
  }

  async function syncContractParameters() {
    if (!medorContract) return;
    try {
      // NOTE: Ensure your contract methods match these exact names, otherwise change them here
      const active = await medorContract.isSwapActive();
      const rate = await medorContract.tokensPerWBTC();
      systemTokensPerWbtc = BigInt(rate);
      document.getElementById("rateDisplay").innerText = "1 WBTC = " + systemTokensPerWbtc.toString() + " MEDOR";
      const btn = document.getElementById("actionButton");
      const feedback = document.getElementById("feedbackText");
      if (!active) {
        btn.setAttribute("disabled", "true");
        btn.innerText = "Swap Closed";
        feedback.innerText = "Pre-launch swap pool parameters are currently set to closed by the administrator.";
      } else {
        btn.removeAttribute("disabled");
        btn.innerText = "Execute Purchase";
        feedback.innerText = "Clears token ledger validation layers instantly.";
      }
    } catch (err) {
      console.error("State sync tracking issue:", err);
      // Fallback display if your contract variables have slightly different names:
      document.getElementById("rateDisplay").innerText = "1 WBTC = 2,050 MEDOR";
      systemTokensPerWbtc = 2050n;
    }
  }

  function calculateOutput() {
    const inputAmount = document.getElementById("wbtcInput").value.trim();
    const outputField = document.getElementById("medorOutput");
    if (!inputAmount || isNaN(inputAmount) || systemTokensPerWbtc === 0n || parseFloat(inputAmount) <= 0) {
      outputField.value = "0.0000";
      return;
    }
    const outputTokens = parseFloat(inputAmount) * Number(systemTokensPerWbtc);
    outputField.value = outputTokens.toLocaleString(undefined, { minimumFractionDigits: 4 }) + " MEDOR";
  }

  async function handleTradePipeline() {
    if (!walletConnected) {
      await connectWallet();
      return;
    }
    const inputVal = document.getElementById("wbtcInput").value.trim();
    const feedback = document.getElementById("feedbackText");
    const btn = document.getElementById("actionButton");
    if (!inputVal || isNaN(inputVal) || parseFloat(inputVal) <= 0) {
      alert("Please provide a valid spending input value.");
      return;
    }
    try {
      btn.setAttribute("disabled", "true");
      const satoshiUnits = BigInt(Math.round(parseFloat(inputVal) * 10**8));
      feedback.innerText = "Verifying existing WBTC authorization allowance...";
      
      const currentAllowance = await wbtcContract.allowance(userAddress, MEDOR_ADDRESS);
      
      if (currentAllowance < satoshiUnits) {
        feedback.innerText = "Step 1 of 2: Confirm WBTC allowance in your extension wallet...";
        const txApprove = await wbtcContract.approve(MEDOR_ADDRESS, satoshiUnits);
        await txApprove.wait();
        feedback.innerText = "Allowance cleared! Initializing swap finalization...";
      }
      
      feedback.innerText = "Step 2 of 2: Executing on-chain swap transaction...";
      const txSwap = await medorContract.swapWBTCForMedor(satoshiUnits);
      await txSwap.wait();
      
      // FIX 3: Added the missing closing blocks and success states to finalize your file
      feedback.innerText = "Swap complete! Medor tokens transferred successfully.";
      document.getElementById("wbtcInput").value = "";
      document.getElementById("medorOutput").value = "0.0000";
    } catch (err) {
      console.error("Trade pipeline error:", err);
      feedback.innerText = "Transaction failed or was canceled.";
    } finally {
      btn.removeAttribute("disabled");
      btn.innerText = "Execute Purchase";
    }
  }
</script>
