<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MedorCoin Explorer</title>
    <script src="https://hcaptcha.com" async defer></script>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background: #fff; width: 100%; max-width: 440px; padding: 35px; border-radius: 8px; border: 1px solid #e7eaf3; box-shadow: 0 0.5rem 1.2rem rgba(189,197,209,.15); }
        .header h1 { font-size: 1.5rem; text-align: center; margin-bottom: 25px; color: #1e2022; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #4b5563; }
        input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        input:focus { outline: none; border-color: #3498db; }
        .h-captcha { margin: 20px 0; display: flex; justify-content: center; }
        .btn-reg { width: 100%; padding: 14px; background: #3498db; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-reg:hover { background: #2980b9; }
        .btn-reg:disabled { background: #bdc3c7; cursor: not-allowed; }
        .error { color: #dc3545; font-size: 0.85rem; margin-top: 10px; display: none; text-align: center; padding: 10px; background: #fff5f5; border-radius: 4px; border: 1px solid #fde8e8; }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h1>Create Account</h1></div>
    <form id="signupForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="Enter username">
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="Enter email address">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Min 12 chars, 1 uppercase, 1 number">
        </div>

        <div class="h-captcha" data-sitekey="YOUR_HCAPTCHA_SITE_KEY"></div>

        <div id="errMsg" class="error"></div>
        <button type="submit" class="btn-reg" id="submitBtn">Register Account</button>
    </form>
</div>

<script>
    // Relative positioning ensures queries hit the domain hosting this exact file
    const API_ROUTE = "/signup";
    const CSRF_ROUTE = "/csrf-token";

    let globalSecurityToken = null;

    async function fetchSecurityContext() {
        try {
            const response = await fetch(CSRF_ROUTE);
            if (!response.ok) throw new Error("Security frame rejected.");
            const context = await response.json();
            globalSecurityToken = context.csrfToken;
        } catch (error) {
            console.error("Initial pipeline connection issue:", error.message);
            displayNotification("Security protocol failed to initialize. Please refresh.");
        }
    }

    function displayNotification(message) {
        const field = document.getElementById('errMsg');
        if (field) {
            field.innerText = message;
            field.style.display = 'block';
        }
    }

    document.getElementById('signupForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        
        const errDiv = document.getElementById('errMsg');
        const actionBtn = document.getElementById('submitBtn');
        if (errDiv) errDiv.style.display = 'none';

        const captchaVerification = hcaptcha.getResponse();
        if (!captchaVerification) {
            displayNotification("Please complete the required verification module.");
            return;
        }

        const registrationPayload = {
            username: document.getElementById('username').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            captchaToken: captchaVerification
        };

        actionBtn.disabled = true;
        actionBtn.innerText = "Processing New Registration...";

        try {
            const transmission = await fetch(API_ROUTE, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': globalSecurityToken || ''
                },
                body: JSON.stringify(registrationPayload)
            });

            const statusReport = await transmission.json();

            if (transmission.ok && statusReport.success) {
                sessionStorage.setItem('medor_claim_id', statusReport.claimId);
                window.location.href = `verify.html?address=${encodeURIComponent(statusReport.address)}`;
            } else {
                throw new Error(statusReport.error || "Submission transaction rejected.");
            }
        } catch (executionError) {
            displayNotification(executionError.message || "Communication fault encountered.");
            actionBtn.disabled = false;
            actionBtn.innerText = "Register Account";
            if (typeof hcaptcha !== 'undefined') hcaptcha.reset();
        }
    });

    // Initialize security background channel on asset paint
    window.addEventListener('DOMContentLoaded', fetchSecurityContext);
</script>
</body>
</html>
